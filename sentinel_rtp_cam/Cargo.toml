[package]
name = "sentinel_rtp_cam"
version = "0.1.0"
edition = "2021"

[dependencies]
# Error handling - using thiserror for typed errors, keeping anyhow for quick prototyping
anyhow = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "process",
    "signal",
    "fs"
] }
tokio-util = "0.7"

# Zero-copy buffer management
bytes = "1"

# Serialization & encoding
base64 = "0.22"
quick-xml = "0.31"

# HTTP client for ONVIF
reqwest = { version = "0.12", features = ["rustls-tls"] }
reqwest-middleware = "0.3"
reqwest-retry = "0.6"

# Cryptography for ONVIF WS-Security
sha1 = "0.10"
md5 = "0.7"
rand = "0.8"

# Utilities
regex = "1"
url = "2"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }