name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write  # Required to create releases

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build binary with cross
        working-directory: sentinel_rtp_cam
        run: |
          cross build --release --bin agent_forward --target ${{ matrix.target }}
      
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --always --dirty)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Package binary
        run: |
          cd sentinel_rtp_cam/target/${{ matrix.target }}/release
          cp agent_forward sentinel_rtp_cam
          cp agent_forward sentinel_rtp_cam_forward

          tar -czf agent_forward-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz agent_forward
          sha256sum agent_forward-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz > agent_forward-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz.sha256

          # Keep the legacy bundle shape for deployed firmware updaters that still
          # fetch sentinel_rtp_cam-<version>-<arch>.tar.gz and extract these names.
          tar -czf sentinel_rtp_cam-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz sentinel_rtp_cam sentinel_rtp_cam_forward
          sha256sum sentinel_rtp_cam-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz > sentinel_rtp_cam-${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.tar.gz.sha256
      
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-bundles-${{ matrix.arch }}
          path: |
            sentinel_rtp_cam/target/${{ matrix.target }}/release/agent_forward-*.tar.gz
            sentinel_rtp_cam/target/${{ matrix.target }}/release/agent_forward-*.sha256
            sentinel_rtp_cam/target/${{ matrix.target }}/release/sentinel_rtp_cam-*.tar.gz
            sentinel_rtp_cam/target/${{ matrix.target }}/release/sentinel_rtp_cam-*.sha256
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
