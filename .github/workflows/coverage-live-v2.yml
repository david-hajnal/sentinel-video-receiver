name: Coverage (live v2)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  live-v2-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check live v2 coverage threshold
        run: LIVE_V2_COVERAGE_THRESHOLD=80 ./scripts/check_live_v2_coverage.sh
